<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffbe5c"/>
      <stop offset=".5" stop-color="#ff8a2a"/>
      <stop offset="1" stop-color="#ee5600"/>
    </linearGradient>
    <linearGradient id="leaf" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9ade4a"/>
      <stop offset="1" stop-color="#4f9a1c"/>
    </linearGradient>
    <linearGradient id="leafDark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#78c532"/>
      <stop offset="1" stop-color="#3c7a13"/>
    </linearGradient>
  </defs>
  <style>
    .arm{transform-box:fill-box}
    .arm-l{transform-origin:100% 88%;animation:waveL 3.8s ease-in-out infinite}
    .arm-r{transform-origin:0% 88%;animation:waveR 3.8s ease-in-out infinite}
    .leaves{transform-box:fill-box;transform-origin:50% 100%;animation:leafSway 4.6s ease-in-out infinite}
    @keyframes waveL{0%,100%{transform:rotate(0)}50%{transform:rotate(-9deg)}}
    @keyframes waveR{0%,100%{transform:rotate(0)}50%{transform:rotate(9deg)}}
    @keyframes leafSway{0%,100%{transform:rotate(-1.4deg)}50%{transform:rotate(1.8deg)}}
    @media (prefers-reduced-motion:reduce){.arm,.leaves{animation:none}}
  </style>
  <g class="leaves">
    <path d="M124,86 C112,76 104,64 102,50 C114,54 126,68 130,86 Z" fill="url(#leafDark)" stroke="#2f6b12" stroke-width="2.5" stroke-linejoin="round"/>
    <path d="M126,84 C112,68 108,46 118,28 C132,42 138,66 132,86 Z" fill="url(#leaf)" stroke="#2f6b12" stroke-width="2.5" stroke-linejoin="round"/>
    <path d="M130,84 C138,58 154,46 174,44 C172,64 156,82 136,90 Z" fill="url(#leaf)" stroke="#2f6b12" stroke-width="2.5" stroke-linejoin="round"/>
    <path d="M128,82 C126,58 132,34 148,22 C154,44 144,72 132,86 Z" fill="url(#leafDark)" stroke="#2f6b12" stroke-width="2.5" stroke-linejoin="round"/>
  </g>
  <g class="arm arm-l">
    <path d="M97,148 C84,146 75,137 71,124" fill="none" stroke="#ff8a2a" stroke-width="8" stroke-linecap="round"/>
    <circle cx="70" cy="122" r="6.4" fill="#ffd9a3" stroke="#d95400" stroke-width="2"/>
  </g>
  <g class="arm arm-r">
    <path d="M161,148 C174,146 183,137 187,124" fill="none" stroke="#ff8a2a" stroke-width="8" stroke-linecap="round"/>
    <circle cx="188" cy="122" r="6.4" fill="#ffd9a3" stroke="#d95400" stroke-width="2"/>
  </g>
