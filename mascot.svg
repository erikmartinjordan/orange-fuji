  <path d="M141,55 C158,45 175,38 190,34" fill="none" stroke="#247117" stroke-width="1.6" stroke-linecap="round" opacity=".7"/>

  <!-- Montaña -->
  <use href="#mtn-shape" fill="#fd8305"/>

  <g clip-path="url(#mtn)">
    <!-- Facetas oscuras de la base -->
    <path d="M8,217 L55,175 L54,190 L63,195 L68,188 L80,207 L92,199 L107,218 L112,224 L8,224 Z" fill="#ef6c02"/>
    <path d="M147,224 L162,208 L174,198 L182,203 L190,193 L200,200 L204,172 L212,187 L230,207 L254,217 L254,224 Z" fill="#f27405"/>
    <path d="M216,166 L232,200 L240,224 L254,224 L254,205 L244,190 Z" fill="#ef6c02" opacity=".8"/>

    <!-- Nieve: sombra + capa -->
    <path d="M40,50 L210,50 L210,123 L187,121 L170,115 L157,105 L148,106 L143,126 L137,118 L128,108 L115,115 L108,101 L74,123 L40,133 Z"
          fill="#f9d3bf" stroke="#f9d3bf" stroke-width="3" stroke-linejoin="round"/>
    <path d="M40,50 L210,50 L210,120 L187,118 L170,112 L157,102 L148,103 L143,123 L137,115 L128,105 L115,112 L108,98 L74,120 L40,130 Z"
          fill="#fdf6f0" stroke="#fdf6f0" stroke-width="3" stroke-linejoin="round"/>
  </g>

  <!-- Contorno -->
  <use href="#mtn-shape" fill="none" stroke="#ef6c02" stroke-width="2.6" stroke-linejoin="round"/>

  <!-- Mejillas -->
  <ellipse cx="83" cy="178" rx="8.5" ry="5.2" fill="#fa7a63" opacity=".85"/>
  <ellipse cx="175" cy="178" rx="8.5" ry="5.2" fill="#fa7a63" opacity=".85"/>

  <!-- Ojos -->
  <g class="eye eye-l">
    <circle cx="99" cy="161" r="13" fill="#3a1d12"/>
    <circle cx="96" cy="157" r="5.6" fill="#fff"/>
    <circle cx="105" cy="167" r="2.3" fill="#fff"/>
    <g class="blink">
      <circle cx="99" cy="161" r="14.4" fill="#fd8305"/>
      <path d="M91.5 159.3 Q99 166.4 106.5 159.3" fill="none" stroke="#3a1d12" stroke-width="2.6" stroke-linecap="round"/>
    </g>
  </g>
  <g class="eye eye-r">
    <circle cx="163" cy="161" r="13" fill="#3a1d12"/>
    <circle cx="161" cy="157" r="5.6" fill="#fff"/>
    <circle cx="169" cy="166" r="2.3" fill="#fff"/>
    <g class="blink">
      <circle cx="163" cy="161" r="14.4" fill="#fd8305"/>
      <path d="M155.5 159.3 Q163 166.4 170.5 159.3" fill="none" stroke="#3a1d12" stroke-width="2.6" stroke-linecap="round"/>
    </g>
  </g>

  <!-- Cejas -->
  <path d="M90,142 Q95,136 101,137" fill="none" stroke="#3a1d12" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M161,137 Q167,136 172,142" fill="none" stroke="#3a1d12" stroke-width="2.2" stroke-linecap="round"/>

  <!-- Sonrisa -->
  <path d="M122,172 C124,182 138,182 140,172" fill="none" stroke="#3a1d12" stroke-width="2.6" stroke-linecap="round"/>
</svg>
