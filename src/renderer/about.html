<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="styles.css">
<style>
  .about-container {
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    padding: 46px 34px 28px;
    -webkit-app-region: drag;
  }
  .about-container img,
  .about-container .name,
  .update-actions,
  .update-progress {
    -webkit-app-region: no-drag;
  }
  .about-container img {
    display: block;
    width: 96px;
    height: 96px;
    margin-bottom: 16px;
    filter: drop-shadow(0 8px 16px rgba(82, 52, 28, 0.18));
  }
  .about-container .name {
    font-size: 17px;
    font-weight: 760;
    letter-spacing: 0;
    margin-bottom: 2px;
  }
  .about-container .version {
    font-size: 12px;
    color: rgba(60, 60, 67, 0.62);
    font-weight: 500;
  }
  .about-container .desc {
    font-size: 11px;
    color: rgba(60, 60, 67, 0.62);
    margin-top: 14px;
    text-align: center;
    line-height: 1.45;
    max-width: 260px;
  }
  .update-panel {
    width: 100%;
    max-width: 286px;
    margin-top: 20px;
    padding-top: 16px;
    border-top: 1px solid rgba(60, 60, 67, 0.14);
    text-align: center;
  }
  .update-status {
    min-height: 32px;
    color: rgba(60, 60, 67, 0.62);
    font-size: 11px;
    line-height: 1.45;
  }
  .update-status.error { color: #c41e1e; }
  .update-status.success { color: #1e8a3e; }
  .update-actions {
    display: flex;
    justify-content: center;
    gap: 7px;
    margin-top: 10px;
  }
  .update-actions button {
    min-width: 72px;
    height: 25px;
    border: 1px solid rgba(60, 60, 67, 0.22);
    border-radius: 5px;
    padding: 0 10px;
    background: linear-gradient(180deg, rgba(255,255,255,0.68), rgba(255,255,255,0.42));
    color: #1d1d1f;
    font: inherit;
    font-size: 12px;
    font-weight: 500;
    cursor: pointer;
    box-shadow: 0 0.5px 0 rgba(255,255,255,0.72) inset, 0 0.5px 0.5px rgba(0,0,0,0.04);
  }
  .update-actions button.secondary {
    color: rgba(60, 60, 67, 0.72);
    background: linear-gradient(180deg, rgba(255,255,255,0.50), rgba(255,255,255,0.26));
  }
  .update-actions button:disabled {
    cursor: default;
    opacity: 0.58;
  }
  .update-progress {
    position: relative;
    margin-top: 12px;
  }
  .update-progress-meta {
    display:flex;justify-content:space-between;align-items:baseline;
    width:259px;margin:0 auto 9px;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size:11px;font-weight:600;letter-spacing:0.02em;
    color: rgba(60,60,67,0.55);
  }
  .update-progress .segs {
    display:flex;align-items:center;justify-content:center;gap:5px;
    height:26px;
  }
  .update-progress .seg{
    flex:0 0 3px;width:3px;height:26px;border-radius:2px;
    background: rgba(60,60,67,0.12);
    transition: background 0.35s ease, box-shadow 0.35s;
  }
  .update-progress .seg.filled{
    background: #f97316;
    box-shadow: 0 0 6px rgba(249,115,22,0.32);
  }
  .update-progress .seg.filling{
    background: rgba(60,60,67,0.30);
  }
  @media (prefers-color-scheme: dark) {
    .about-container .name { color: #f0ede8; }
    .about-container .version,
    .about-container .desc { color: rgba(220, 215, 210, 0.62); }
    .update-panel { border-top-color: rgba(255,255,255,0.12); }
    .update-status { color: rgba(220, 215, 210, 0.62); }
    .update-status.error { color: #fca5a5; }
    .update-status.success { color: #86efac; }
    .update-actions button {
      border-color: rgba(255,255,255,0.14);
      background: linear-gradient(180deg, rgba(255,255,255,0.16), rgba(255,255,255,0.08));
      color: #f0ede8;
      box-shadow: 0 0.5px 0 rgba(255,255,255,0.08) inset, 0 0.5px 0.5px rgba(0,0,0,0.18);
    }
    .update-actions button.secondary {
      color: rgba(220,215,210,0.60);
      background: linear-gradient(180deg, rgba(255,255,255,0.11), rgba(255,255,255,0.05));
    }
    .update-progress .seg{ background: rgba(255,255,255,0.08); }
    .update-progress-meta { color: rgba(220,215,210,0.55); }
    .update-progress .seg.filled{ background: #f97316; }
    .update-progress .seg.filling{ background: rgba(255,255,255,0.20); }
  }
  /* Transitions.dev — Success check */
  :root {
    --check-opacity-dur: 500ms;
    --check-rotate-dur: 500ms;
    --check-rotate-from: 80deg;
    --check-bob-dur: 500ms;
    --check-y-amount: 40px;
    --check-blur-dur: 500ms;
    --check-blur-from: 10px;
    --check-path-dur: 500ms;
    --check-path-delay: 80ms;
    --check-ease-out: cubic-bezier(0.22, 1, 0.36, 1);
    --check-ease-opacity: cubic-bezier(0.22, 1, 0.36, 1);
    --check-ease-rotate: cubic-bezier(0.22, 1, 0.36, 1);
    --check-ease-bob: cubic-bezier(0.34, 1.35, 0.64, 1);
    --check-ease-path: cubic-bezier(0.22, 1, 0.36, 1);
  }
  .t-success-check {
    display: inline-block;
    transform-origin: center;
    opacity: 0;
    will-change: transform, opacity, filter;
    vertical-align: middle;
    margin-right: 6px;
  }
  .t-success-check svg { display: block; overflow: visible; }
  .t-success-check svg path {
    stroke-dasharray: 20;
    stroke-dashoffset: 20;
  }
  .t-success-check[data-state="in"] {
    animation:
      t-check-fade   var(--check-opacity-dur) var(--check-ease-opacity) forwards,
      t-check-rotate var(--check-rotate-dur)  var(--check-ease-rotate)  forwards,
      t-check-blur   var(--check-blur-dur)    var(--check-ease-out)     forwards,
      t-check-bob    var(--check-bob-dur)     var(--check-ease-bob)     forwards;
  }
  .t-success-check[data-state="in"] svg path {
    animation: t-check-draw var(--check-path-dur) var(--check-ease-path) var(--check-path-delay, 0ms) forwards;
  }
  @keyframes t-check-fade { from { opacity: 0; } to { opacity: 1; } }
  @keyframes t-check-rotate {
    from { transform: rotate(var(--check-rotate-from)); }
    to   { transform: rotate(0deg); }
  }
  @keyframes t-check-blur {
    from { filter: blur(var(--check-blur-from)); }
    to   { filter: blur(0); }
  }
  @keyframes t-check-bob {
    from { translate: 0 var(--check-y-amount); }
    to   { translate: 0 0; }
  }
  @keyframes t-check-draw { to { stroke-dashoffset: 0; } }
  @media (prefers-reduced-motion: reduce) {
    .t-success-check { animation: none !important; opacity: 1; }
    .t-success-check svg path { animation: none !important; stroke-dashoffset: 0 !important; }
  }
  .update-success-row {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
  }
  [hidden] { display: none !important; }
  .update-success-row .t-success-check { color: #1e8a3e; }
  @media (prefers-color-scheme: dark) {
    .update-success-row .t-success-check { color: #86efac; }
  }
</style>
</head>
<body class="preferences-window">
  <div class="about-container">
    <img id="icon" alt="Orange Fuji icon">
    <div class="name">Orange Fuji</div>
    <div class="version" id="version"></div>
    <div class="desc" id="desc"></div>
    <div class="update-panel" aria-label="Updates">
      <div class="update-status" id="update-status"><span class="update-success-row" id="update-success-row" hidden><span class="t-success-check" data-state="out" id="update-success-check" aria-hidden="true"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4 4 9-9"></path></svg></span><span id="update-status-text">Checking update status...</span></span><span id="update-status-fallback">Checking update status...</span></div>
      <div class="update-actions">
        <button type="button" id="update-app" hidden>Update</button>
      </div>
      <div class="update-progress" id="update-progress" hidden>
        <div class="update-progress-meta">
          <span class="update-progress-bytes"></span>
          <span class="update-progress-pct"></span>
        </div>
        <div class="segs"></div>
      </div>
    </div>
  </div>
  <script>
    const params = new URLSearchParams(window.location.search);
    document.getElementById('version').textContent = 'Version ' + (params.get('version') || '');
    document.getElementById('desc').textContent = params.get('description') || '';
    const { ipcRenderer } = require('electron');
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') ipcRenderer.send('close-about');
    });

    const updateStatus = document.getElementById('update-status');
    const updateSuccessRow = document.getElementById('update-success-row');
    const updateSuccessCheck = document.getElementById('update-success-check');
    const updateStatusText = document.getElementById('update-status-text');
    const updateStatusFallback = document.getElementById('update-status-fallback');
    const updateApp = document.getElementById('update-app');
    const updateProgress = document.getElementById('update-progress');

    function playCling() {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        if (ctx.state === 'suspended') ctx.resume();
        const t = ctx.currentTime;
        // Coin collect: bright 988Hz -> 1318Hz (Mario-style), short + sparkle
        const coin = (freq, vol, dur, delay = 0) => {
          const o = ctx.createOscillator();
          const g = ctx.createGain();
          const f = ctx.createBiquadFilter();
          f.type = 'highshelf'; f.frequency.value = 1200; f.gain.value = 2;
          o.type = 'sine';
          o.frequency.value = freq;
          o.connect(f); f.connect(g); g.connect(ctx.destination);
          g.gain.setValueAtTime(0, t + delay);
          g.gain.linearRampToValueAtTime(vol, t + delay + 0.008);
          g.gain.exponentialRampToValueAtTime(0.001, t + delay + dur);
          o.start(t + delay); o.stop(t + delay + dur);
        };
        coin(988, 0.28, 0.18, 0);
        coin(1318, 0.32, 0.42, 0.07);
        // subtle triangle overtone for shine
        const o2 = ctx.createOscillator();
        const g2 = ctx.createGain();
        o2.type = 'triangle';
        o2.frequency.value = 2637;
        o2.connect(g2); g2.connect(ctx.destination);
        g2.gain.setValueAtTime(0, t + 0.07);
        g2.gain.linearRampToValueAtTime(0.06, t + 0.078);
        g2.gain.exponentialRampToValueAtTime(0.001, t + 0.28);
        o2.start(t + 0.07); o2.stop(t + 0.28);
      } catch(e) {}
    }

    function triggerSuccessCheck() {
      if (!updateSuccessCheck) return;
      updateSuccessCheck.setAttribute('data-state', 'out');
      void updateSuccessCheck.offsetWidth;
      requestAnimationFrame(() => {
        updateSuccessCheck.setAttribute('data-state', 'in');
        playCling();
      });
    }

    function setUpdateMessage(message = '', type = '') {
      if (updateStatusText) updateStatusText.textContent = message;
      if (updateStatusFallback) updateStatusFallback.textContent = message;
      updateStatus.classList.toggle('error', type === 'error');
      updateStatus.classList.toggle('success', type === 'success');
      const isDownloaded = type === 'success' && /ready|completed/i.test(message);
      if (updateSuccessRow && updateStatusFallback) {
        const showCheck = isDownloaded;
        updateSuccessRow.hidden = !showCheck;
        updateStatusFallback.hidden = showCheck;
        if (showCheck) triggerSuccessCheck();
        else if (updateSuccessCheck) updateSuccessCheck.setAttribute('data-state', 'out');
      }
    }

    function renderUpdateState(state = {}) {
      const status = state.status || 'idle';
      const supported = state.supported !== false;
      const busy = status === 'checking' || status === 'downloading' || status === 'installing';
      const canDownload = supported && status === 'available';
      const canInstall = supported && status === 'downloaded';
      const canRetry = supported && status === 'error';
      const message = state.error || state.message || 'Up to date';

      setUpdateMessage(message, status === 'error' ? 'error' : (status === 'downloaded' || status === 'idle' ? 'success' : ''));
      updateStatus.hidden = status === 'downloading';
      const showUpdate = (canDownload || canInstall || canRetry) && !busy;
      updateApp.hidden = !showUpdate;
      updateApp.disabled = busy;
      updateApp.textContent = canInstall ? 'Restart' : (canRetry ? 'Try again' : 'Update');
      updateApp.dataset.action = canInstall ? 'install' : (canRetry ? 'check' : 'download');

      const percent = Number(state.progress?.percent);
      const hasProgress = status === 'downloading' && Number.isFinite(percent);
      updateProgress.hidden = !hasProgress;
      // keep for tests
      updateProgress.style.setProperty('--update-progress', hasProgress ? `${Math.max(0, Math.min(100, percent))}%` : '0%');
      const segsBox = updateProgress.querySelector('.segs');
      const pctEl = updateProgress.querySelector('.update-progress-pct');
      const bytesEl = updateProgress.querySelector('.update-progress-bytes');
      // segmented pills — delicate, like IMG_5887.PNG (33 thin vertical pills, 5px gap, mono meta above)
      const segs = 33;
      // remove old segs
      segsBox.querySelectorAll('.seg').forEach(el=>el.remove());
      if (pctEl) pctEl.textContent = hasProgress ? `${Math.round(percent)}%` : '';
      const transferred = Number(state.progress?.transferred);
      const total = Number(state.progress?.total);
      const fmtMB = (b) => {
        const mb = b / (1024 * 1024);
        return mb.toFixed(1) + ' MB';
      };
      if (bytesEl) bytesEl.textContent = (hasProgress && Number.isFinite(total) && total > 0 && Number.isFinite(transferred))
        ? `${fmtMB(transferred)} / ${fmtMB(total)}` : '';
      if (hasProgress) {
        const filled = Math.round(segs * Math.max(0, Math.min(100, percent)) / 100);
        for (let i=0;i<segs;i++){
          const el=document.createElement('div');
          el.className='seg'+(i<filled?' filled':'')+(i===filled && percent<100?' filling':'');
          segsBox.appendChild(el);
        }
      }
    }

    async function invokeUpdate(channel, fallbackState) {
      renderUpdateState(fallbackState);
      try {
        renderUpdateState(await ipcRenderer.invoke(channel));
      } catch (error) {
        setUpdateMessage(error?.message || 'Update action failed.', 'error');
      }
    }

    ipcRenderer.on('app-update-state', (_, state) => renderUpdateState(state));
    ipcRenderer.invoke('get-app-update-state').then((state) => {
      renderUpdateState(state);
      if (state?.supported !== false && (state?.status === 'idle' || !state?.status)) {
        invokeUpdate('check-for-app-updates', { status: 'checking', supported: true, message: 'Checking...' });
      } else if (state?.status === 'error') {
        invokeUpdate('check-for-app-updates', { status: 'checking', supported: true, message: 'Checking...' });
      }
    }).catch((error) => {
      setUpdateMessage(error?.message || '', 'error');
    });
    updateApp.addEventListener('click', () => {
      if (updateApp.dataset.action === 'install') {
        invokeUpdate('install-app-update', { status: 'installing', supported: true, message: 'Installing...' });
      } else if (updateApp.dataset.action === 'check') {
        invokeUpdate('check-for-app-updates', { status: 'checking', supported: true, message: 'Checking...' });
      } else {
        invokeUpdate('download-app-update', { status: 'downloading', supported: true, message: 'Downloading...', progress: { percent: 0 } });
      }
    });
  </script>
</body>
</html>
