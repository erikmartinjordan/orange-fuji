<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:;">
  <title>Orange Fuji — Welcome</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="onboarding-window">
  <div class="onboarding-panel">
    <div class="onboarding-titlebar" aria-hidden="true"></div>

    <header class="onboarding-header">
      <img class="onboarding-icon" src="../assets/icons/macos/256x256.png" alt="">
      <h1>Welcome to Orange&nbsp;Fuji</h1>
    </header>

    <!-- Step indicator -->
    <ol class="ob-steps" aria-label="Setup steps">
      <li class="ob-step" data-step="grant"><span class="ob-step-dot"></span><span class="ob-step-label">Allow access</span></li>
      <li class="ob-step" data-step="enable"><span class="ob-step-dot"></span><span class="ob-step-label">Enable in Settings</span></li>
      <li class="ob-step" data-step="relaunch"><span class="ob-step-dot"></span><span class="ob-step-label">Restart</span></li>
    </ol>

    <!-- Stage -->
    <section class="ob-card" id="ob-card">
      <div class="ob-stage" id="ob-stage" aria-hidden="true">
        <svg class="ob-art ob-art-ask" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
          <rect x="6" y="10" width="36" height="24" rx="4"/>
          <path d="M18 40h12M24 34v6"/>
          <circle cx="24" cy="22" r="5"/>
        </svg>
        <svg class="ob-art ob-art-wait" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
          <rect x="14" y="8" width="20" height="32" rx="5"/>
          <path d="M24 16v8l5 3"/>
        </svg>
        <svg class="ob-art ob-art-done" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="24" cy="24" r="17"/>
          <path d="M16.5 24.5l5 5L32 19"/>
        </svg>
      </div>

      <h2 class="ob-title" id="ob-title">One quick permission</h2>
      <p class="ob-copy" id="ob-copy">macOS needs your approval before Orange Fuji can capture the screen.</p>

      <div class="ob-status" id="ob-status" role="status" aria-live="polite">
        <span class="ob-status-dot" id="ob-dot"></span>
        <span id="ob-status-text">Checking…</span>
      </div>
    </section>

    <!-- Single primary action -->
    <button class="ob-primary" id="ob-action">Grant Access</button>
    <p class="ob-hint" id="ob-hint">A macOS dialog will appear — nothing is shared until you allow it.</p>

    <button class="ob-skip" id="ob-skip">Not now</button>
  </div>

  <script src="onboarding.js"></script>
</body>
</html>
