<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <style>
      * { box-sizing: border-box; }
      html, body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: transparent;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        user-select: none;
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 8px;
      }
      .toast {
        width: 224px;
        height: 176px;
        padding: 8px;
        border: 1px solid rgba(255,255,255,0.22);
        border-radius: 14px;
        background: rgba(8,10,14,0.78);
        backdrop-filter: blur(16px);
        color: rgba(255,255,255,0.92);
        cursor: grab;
        box-shadow: none;
        outline: none;
        transition: transform 0.15s ease, background 0.15s ease;
        -webkit-app-region: drag;
      }
      .toast:active { cursor: grabbing; }
      .toast.dragging { opacity: 0.92; transform: scale(0.98); }
      .toast:not(.ready) {
        visibility: hidden;
      }
      .toast:hover { transform: scale(1.025); background: rgba(18,20,24,0.9); }
      .toast:focus,
      .toast:focus-visible {
        outline: none;
        box-shadow: none;
      }
      img {
        display: block;
        width: 100%;
        height: 120px;
        object-fit: contain;
        border-radius: 9px;
        background: rgba(255,255,255,0.06);
        box-shadow: none;
        opacity: 0;
        transition: opacity 0.08s ease;
        -webkit-app-region: no-drag;
        -webkit-user-drag: none;
        user-select: none;
      }
      .toast.ready img {
        opacity: 1;
      }
      .label {
        margin-top: 7px;
        overflow: hidden;
        white-space: nowrap;
        text-overflow: ellipsis;
        color: rgba(255,255,255,0.86);
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.01em;
        text-align: center;
        -webkit-app-region: no-drag;
      }
      .hint {
        margin-top: 2px;
        font-size: 9px;
        color: rgba(255,255,255,0.55);
        text-align: center;
        font-weight: 500;
        -webkit-app-region: no-drag;
      }
    </style>
  </head>
  <body>
    <div class="toast" id="toast" role="button" tabindex="0" aria-label="Open capture preview">
      <img id="preview" alt="Capture preview" draggable="false">
      <div class="label" id="label">Click to edit capture</div>
      <div class="hint" id="hint">Drag to Desktop • Slide to reposition</div>
    </div>
    <script>
      const { ipcRenderer } = require('electron');
      const params = new URLSearchParams(window.location.search);
      const captureMode = params.get('captureMode') || 'region';
      const toast = document.getElementById('toast');
      const preview = document.getElementById('preview');
      const label = document.getElementById('label');
      label.textContent = `Click to edit ${captureMode} capture`;

      function showReadyToast() {
        toast.classList.add('ready');
      }

      function setPreviewSource(dataUrl) {
        if (!dataUrl) {
          showReadyToast();
          return;
        }
        preview.addEventListener('load', showReadyToast, { once: true });
        preview.addEventListener('error', showReadyToast, { once: true });
        preview.src = dataUrl;
        if (preview.complete && preview.naturalWidth > 0) showReadyToast();
      }

      ipcRenderer.invoke('preview-toast-data').then((payload) => {
        setPreviewSource(payload?.dataUrl);
        if (payload?.captureMode) label.textContent = `Click to edit ${payload.captureMode} capture`;
      }).catch(showReadyToast);

      function playCaptureChime() {
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        if (!AudioContextClass) return;
        const ctx = new AudioContextClass();
        const now = ctx.currentTime;
        [659.25, 783.99, 1046.5].forEach((frequency, index) => {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(frequency, now);
          gain.gain.setValueAtTime(0.0001, now);
          const start = now + index * 0.08;
          const end = start + 0.23;
          gain.gain.exponentialRampToValueAtTime(0.08, start + 0.03);
          gain.gain.exponentialRampToValueAtTime(0.0001, end);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(start);
          osc.stop(end);
        });
        setTimeout(() => ctx.close().catch(() => {}), 700);
      }

      const openPreview = () => {
        if (didDrag) return;
        ipcRenderer.send('preview-toast-clicked');
      };
      let isDraggingFile = false;
      let didDrag = false;
      let dragStartX = 0;
      let dragStartY = 0;
      const DRAG_THRESHOLD = 6;

      // Keep toast alive while user interacts
      toast.addEventListener('mouseenter', () => ipcRenderer.send('preview-toast-keep-alive'));

      toast.addEventListener('click', openPreview);
      toast.addEventListener('keydown', (event) => {
        if (event.key === 'Enter' || event.key === ' ') {
          event.preventDefault();
          openPreview();
        }
      });

      // Native file drag: dragging the thumbnail creates a real file you can drop on Desktop/Finder/etc.
      function startFileDrag() {
        if (isDraggingFile) return;
        isDraggingFile = true;
        toast.classList.add('dragging');
        ipcRenderer.send('preview-toast-drag-start');
        // Reset after drop animation
        setTimeout(() => {
          isDraggingFile = false;
          toast.classList.remove('dragging');
        }, 900);
      }

      preview.addEventListener('mousedown', (e) => {
        if (e.button !== 0) return;
        dragStartX = e.clientX;
        dragStartY = e.clientY;
        didDrag = false;
      });

      preview.addEventListener('mousemove', (e) => {
        if (e.buttons !== 1) return;
        const dx = e.clientX - dragStartX;
        const dy = e.clientY - dragStartY;
        if (Math.hypot(dx, dy) > DRAG_THRESHOLD) {
          didDrag = true;
          startFileDrag();
        }
      });

      preview.addEventListener('mouseup', () => {
        // Click vs drag decision handled by didDrag flag; click handler will bail if didDrag
        setTimeout(() => { didDrag = false; }, 120);
      });

      // Also support touch / pointer drag for trackpad
      preview.addEventListener('dragstart', (e) => {
        e.preventDefault();
        startFileDrag();
      });

      window.addEventListener('DOMContentLoaded', playCaptureChime);
    </script>
  </body>
</html>
