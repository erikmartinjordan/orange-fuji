name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            platform: mac
          - os: windows-latest
            platform: win
          - os: ubuntu-latest
            platform: linux

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'


      - name: Prefetch ffmpeg static binary
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').dependencies['ffmpeg-static'].replace(/[^0-9.]/g,'')")
          TAG=$(npm view "ffmpeg-static@$VERSION" "ffmpeg-static.binary-release-tag" --json | tr -d '"')
          PLATFORM=$(node -p "process.platform")
          ARCH=$(node -p "process.arch")
          DEST="$RUNNER_TEMP/ffmpeg-prefetch"
          rm -rf "$DEST"
          mkdir -p "$DEST" src/bin
          gh release download "$TAG" --repo eugeneware/ffmpeg-static \
            --pattern "ffmpeg-${PLATFORM}-${ARCH}.gz" \
            --pattern "${PLATFORM}-${ARCH}.README" \
            --pattern "${PLATFORM}-${ARCH}.LICENSE" -D "$DEST"
          node -e "const fs=require('fs'),zlib=require('zlib');fs.writeFileSync(process.argv[1],zlib.gunzipSync(fs.readFileSync(process.argv[2])))" "$DEST/ffmpeg-bin" "$DEST/ffmpeg-${PLATFORM}-${ARCH}.gz"
          chmod +x "$DEST/ffmpeg-bin" || true
          echo "FFMPEG_BIN=$DEST/ffmpeg-bin" >> "$GITHUB_ENV"
          if [ "$PLATFORM" = "darwin" ]; then
            for arch in arm64 x64; do
              mkdir -p "$DEST/darwin-$arch"
              gh release download "$TAG" --repo eugeneware/ffmpeg-static --pattern "ffmpeg-darwin-$arch.gz" -D "$DEST/darwin-$arch"
              node -e "const fs=require('fs'),zlib=require('zlib');fs.writeFileSync(process.argv[1],zlib.gunzipSync(fs.readFileSync(process.argv[2])))" "src/bin/ffmpeg-$arch" "$DEST/darwin-$arch/ffmpeg-darwin-$arch.gz"
              chmod +x "src/bin/ffmpeg-$arch"
            done
          fi

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('package.json') }}
          restore-keys: |
            ${{ runner.os }}-node-modules-

      - name: Install dependencies
        run: npm install

      - name: Hydrate ffmpeg static binary
        shell: bash
        run: |
          set -euo pipefail
          PLATFORM=$(node -p "process.platform")
          EXT=""
          if [ "$PLATFORM" = "win32" ]; then EXT=".exe"; fi
          cp "$RUNNER_TEMP/ffmpeg-prefetch/ffmpeg-bin" "node_modules/ffmpeg-static/ffmpeg${EXT}"
          chmod +x "node_modules/ffmpeg-static/ffmpeg${EXT}" || true
          echo "FFMPEG_BIN=" >> "$GITHUB_ENV"

      - name: Run tests
        run: npm test

      - name: Configure PRO license
        if: github.event_name != 'pull_request' && vars.ORANGE_FUJI_LICENSE_TARGET == 'pro'
        run: npm run configure-license
        env:
          ORANGE_FUJI_LICENSE_TARGET: ${{ vars.ORANGE_FUJI_LICENSE_TARGET }}
          ORANGE_FUJI_PRO_BUY_LICENSE_URL: ${{ vars.ORANGE_FUJI_PRO_BUY_LICENSE_URL || secrets.ORANGE_FUJI_PRO_BUY_LICENSE_URL }}
          ORANGE_FUJI_PRO_LICENSE_API_BASE_URL: ${{ vars.ORANGE_FUJI_PRO_LICENSE_API_BASE_URL || secrets.ORANGE_FUJI_PRO_LICENSE_API_BASE_URL }}
          ORANGE_FUJI_PRO_SUPABASE_PUBLISHABLE_KEY: ${{ vars.ORANGE_FUJI_PRO_SUPABASE_PUBLISHABLE_KEY || secrets.ORANGE_FUJI_PRO_SUPABASE_PUBLISHABLE_KEY }}

      - name: Build (macOS)
        if: matrix.platform == 'mac'
        run: npm run build:mac -- --publish never
        env:
          DEBUG: electron-builder,electron-osx-sign*
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Build legacy macOS DMG
        if: matrix.platform == 'mac'
        run: npm run build:mac:legacy -- --publish never
        env:
          DEBUG: electron-builder,electron-osx-sign*
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Build (Windows)
        if: matrix.platform == 'win'
        run: npm run build:win -- --publish never
        env:
          CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Install FUSE (Linux AppImage)
        if: matrix.platform == 'linux'
        run: sudo apt-get update && sudo apt-get install -y libfuse2

      - name: Build (Linux)
        if: matrix.platform == 'linux'
        run: npm run build:linux -- --publish never

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: orange-fuji-${{ matrix.platform }}
          path: |
            dist/**/*.dmg
            dist/**/*.zip
            dist/**/*.exe
            dist/**/*.AppImage
            dist/**/*.yml
            dist/**/*.blockmap
          if-no-files-found: ignore
